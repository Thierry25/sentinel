services:
  kafka:
    image: apache/kafka:3.9.0 # single node
    ports: ["9092:9092"]

  db2:
    image: icr.io/db2_community/db2
    platform: linux/amd64
    privileged: true
    ports: ["50000:50000"]
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: sentinel
      DBNAME: SENTINEL
    volumes: ["db2data:/database"]

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports: ["8080:8080"]
    volumes: ["jenkins_home:/var/jenkins_home"]

volumes:
  db2data: {}
  jenkins_home: {}
